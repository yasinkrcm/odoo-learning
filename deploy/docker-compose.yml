# ============================================================
#  PRODUCTION stack — Odoo 19 + PostgreSQL 15 + Caddy (HTTPS)
#  Dosyaların yazıldığı konum: /opt/odoo
#  Secrets deploy/.env dosyasından gelir (git'e girmez!)
# ============================================================

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # İstemeden dışarı AÇIK DEĞİL — host port yayını yok (yoksa açma!)

  web:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOST=db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--load-language=tr_TR"]
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-web-data:/var/lib/odoo
    restart: unless-stopped
    # Host 8069'a gerek yok — Caddy içeriden bağlanıyor
    # (debuging dışı; acil direkt erişim istersen aşağıyı aç)
    # ports:
    #   - "127.0.0.1:8069:8069"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:8069/web/webclient/config?debug=0', timeout=10)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  caddy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddyfile'daki {$SITE_DOMAIN} yerine geçer
      - SITE_DOMAIN=${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  caddy-config:
  caddy-data:
