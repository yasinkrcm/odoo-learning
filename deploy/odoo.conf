# ============================================================
#  Odoo PRODUCTION konfigürasyonu (demo/portfolyo profili)
#  DEPLOY KOMUTUNDA ŞU DEĞERLERİ GÜNCELLE:
#    admin_passwd = GÜÇLÜ_MASTER_SIFRASI   (DB yönetim şifresi)
# ============================================================

[options]
; --- Veritabanı bağlantısı ---
; UYARI: db_host/db_user/db_password'ü conf'ta yazma! Dilsiz kalan conf
; alanları compose .env'den (HOST/USER/PASSWORD env'leri) gelir.
; wait-for-psql.py conf'taki değeri env'inÜZERİNE yazar; placeholder
; şifre bırakırsan "password authentication failed" döngüsüne düşersin.
dbfilter = ^odoo_prod$
list_db = False

; --- Ana şifre: DB create/drop/delete erişimini korur ---
; $ openssl rand -base64 32  çıktısını buraya yaz
admin_passwd = ÇALIŞTIRMA-ÖNCESİ-DEĞİŞTİR-GÜÇLÜ-DEĞER-YAZ

; --- Kaynak / performans (demo profil: hafif) ---
workers = 1
limit_memory_hard = 750000000
limit_memory_soft = 650000000
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 240
max_crontab_jobs = 4

; --- Reverse proxy arkasında (Caddy veya nginx) → ŞART ---
proxy_mode = True

; --- Yollar ---
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Log ---
logfile = False
log_level = info
