services:
  web:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: >
      odoo --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      --db-filter=^yasin-db$ --max-cron-threads=1
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - ./data/db:/var/lib/postgresql/data
