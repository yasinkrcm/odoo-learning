<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Odoo 19 Custom Addons — Social Card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#a5b4fc" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 160 H1280"/><path d="M0 320 H1280"/><path d="M0 480 H1280"/>
    <path d="M320 0 V640"/><path d="M640 0 V640"/><path d="M960 0 V640"/>
  </g>

  <!-- Odoo-ish mark -->
  <g transform="translate(96 128)">
    <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#accent)"/>
    <circle cx="64" cy="64" r="34" fill="#0f172a"/>
    <circle cx="64" cy="64" r="14" fill="#e0e7ff"/>
  </g>

  <!-- headling -->
  <text x="260" y="200" font-family="Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#f8fafc">Odoo 19 Custom Addons</text>
  <text x="264" y="262" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Modüler uygulama geliştirme · RPC Entegrasyonları · Webhook'lar · QWeb Raporlar</text>
  <text x="264" y="314" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#94a3b8">7 custom module · Docker + PostgreSQL 15 · XML-RPC client scripts · JSON-RPC endpoints</text>

  <!-- module chips -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600">
    <rect x="260" y="368" width="292" height="52" rx="26" fill="url(#chip)" stroke="#a5b4fc" stroke-opacity="0.35"/>
    <text x="406" y="401" text-anchor="middle" fill="#c7d2fe">buksu_hakedis</text>

    <rect x="568" y="368" width="280" height="52" rx="26" fill="url(#chip)" stroke="#67e8f9" stroke-opacity="0.35"/>
    <text x="708" y="401" text-anchor="middle" fill="#a5f3fc">nisa_pos_sync</text>

    <rect x="864" y="368" width="300" height="52" rx="26" fill="url(#chip)" stroke="#86efac" stroke-opacity="0.35"/>
    <text x="1014" y="401" text-anchor="middle" fill="#bbf7d0">buksu_stok_saha</text>

    <rect x="260" y="436" width="272" height="52" rx="26" fill="url(#chip)" stroke="#fda4af" stroke-opacity="0.35"/>
    <text x="396" y="469" text-anchor="middle" fill="#fecdd3">mini_helpdesk</text>

    <rect x="548" y="436" width="262" height="52" rx="26" fill="url(#chip)" stroke="#fdba74" stroke-opacity="0.35"/>
    <text x="679" y="469" text-anchor="middle" fill="#fed7aa">telegram_notify</text>

    <rect x="826" y="436" width="338" height="52" rx="26" fill="url(#chip)" stroke="#c4b5fd" stroke-opacity="0.35"/>
    <text x="995" y="468" text-anchor="middle" font-size="20" fill="#ddd6fe">my_first_module · sale_custom</text>
  </g>

  <!-- footer accent line + repo handle -->
  <rect x="96" y="540" width="1088" height="6" rx="3" fill="url(#accent)"/>
  <text x="96" y="596" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#94a3b8">github.com/yasinkrcm/odoo-learning</text>
  <text x="1184" y="596" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#e0e7ff">LGPL-3 · Odoo 19 Community</text>
</svg>
