<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" role="img" aria-label="telegram_notify">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="940" height="220" rx="12" fill="#ffffff" stroke="#fdba74"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#h)"/>
  <text x="24" y="29" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">telegram_notify — Telegram İş Bildirimleri</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffedd5">depends: sale, account</text>

  <text x="24" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#c2410c">MODELLER</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#7c2d12">
    <rect x="24" y="86" width="196" height="30" rx="15" fill="#ffedd5" stroke="#fdba74"/>
    <text x="122" y="105" text-anchor="middle" font-weight="600">telegram.notifier (Abstract)</text>
    <rect x="24" y="122" width="196" height="30" rx="15" fill="#ffedd5" stroke="#fdba74"/>
    <text x="122" y="141" text-anchor="middle" font-weight="600">sale.order (inherit)</text>
    <rect x="24" y="158" width="196" height="30" rx="15" fill="#ffedd5" stroke="#fdba74"/>
    <text x="122" y="177" text-anchor="middle" font-weight="600">account.move (inherit)</text>
  </g>

  <text x="470" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#c2410c">ÖNE ÇIKANLAR</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">
    <circle cx="476" cy="95" r="3" fill="#ea580c"/><text x="488" y="99">Secrets ir.config_parameter'da — kodda token yok</text>
    <circle cx="476" cy="119" r="3" fill="#ea580c"/><text x="488" y="123">action_confirm override → sipariş onay bildirimi</text>
    <circle cx="476" cy="143" r="3" fill="#ea580c"/><text x="488" y="147">Günlük ir.cron: vadesi geçmiş fatura raporu (ilk 20)</text>
    <circle cx="476" cy="167" r="3" fill="#ea580c"/><text x="488" y="171">Telegram erişilemezse satış engellenmez — sadece tür loglanır</text>
    <circle cx="476" cy="191" r="3" fill="#ea580c"/><text x="488" y="195">_send(text, parse_mode='HTML') ile biçimli mesaj desteği</text>
  </g>
</svg>
