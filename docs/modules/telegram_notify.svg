<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-label="telegram_notify mimari">
  <defs>
    <linearGradient id="hh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="940" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#hh)"/>
  <text x="24" y="29" font-family="Helvetica" font-size="17" font-weight="700" fill="#ffffff">telegram_notify — Bildirim Tetikleyicileri</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica" font-size="11.5" fill="#ffedd5">depends: sale, account</text>

  <!-- sale.order trigger -->
  <g font-family="Helvetica">
    <rect x="24" y="70" width="250" height="120" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="24" y="70" width="250" height="26" rx="9" fill="#ffedd5"/>
    <text x="34" y="88" font-size="12" font-weight="700" fill="#7c2d12">sale.order (extend)</text>
    <text x="34" y="116" font-size="10.5" fill="#334155">action_confirm() override</text>
    <text x="34" y="133" font-size="10.5" fill="#334155">önce super() — satış akışına dokunmaz</text>
    <text x="34" y="150" font-size="10.5" fill="#334155">bildirim: name, customer, amount_total</text>
    <text x="34" y="172" font-size="10.5" fill="#9a3412">RPC ile onaylanan sipariş de tetikler</text>
  </g>

  <!-- notifier -->
  <g font-family="Helvetica">
    <rect x="330" y="70" width="280" height="150" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="330" y="70" width="280" height="26" rx="9" fill="#ffedd5"/>
    <text x="340" y="88" font-size="12" font-weight="700" fill="#7c2d12">telegram.notifier (AbstractModel)</text>
    <text x="340" y="116" font-size="10.5" fill="#334155">_send(text, parse_mode=None) — '_' öneki</text>
    <text x="340" y="133" font-size="10.5" fill="#334155">RPC'den çağrılamaz (dışarıdan emniyet)</text>
    <text x="340" y="150" font-size="10.5" fill="#334155">hata yakalanır — satış akışı ASLA durmaz</text>
    <text x="340" y="167" font-size="10.5" fill="#334155">yalnızca hata TÜRÜ loglanır (token güvenliği)</text>
    <text x="340" y="190" font-size="10.5" fill="#9a3412">mini_helpdesk bu modeli parse_mode='HTML' kullanır</text>
    <path d="M274 130 H326" stroke="#b45309" stroke-width="1.6" marker-end="url(#d)"/>
    <text x="303" y="120" text-anchor="middle" font-size="10" fill="#b45309">tetikleyici</text>
  </g>

  <!-- config -->
  <g font-family="Helvetica">
    <rect x="666" y="70" width="250" height="120" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="666" y="70" width="250" height="26" rx="9" fill="#fef3c7"/>
    <text x="676" y="88" font-size="12" font-weight="700" fill="#92400e">ir.config_parameter</text>
    <text x="676" y="116" font-size="10.5" fill="#334155">telegram_notify.bot_token</text>
    <text x="676" y="133" font-size="10.5" fill="#334155">telegram_notify.chat_id</text>
    <text x="676" y="155" font-size="10.5" fill="#b45309">kodda secret yok — hepsi DB'de</text>
    <path d="M662 130 H614" stroke="#b45309" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#d)"/>
    <text x="640" y="120" text-anchor="middle" font-size="10" fill="#b45309">ayarlar</text>
  </g>

  <!-- cron -->
  <g font-family="Helvetica">
    <rect x="24" y="240" width="250" height="120" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="24" y="240" width="250" height="26" rx="9" fill="#ffedd5"/>
    <text x="34" y="258" font-size="12" font-weight="700" fill="#7c2d12">account.move (extend)</text>
    <text x="34" y="286" font-size="10.5" fill="#334155">_telegram_overdue_report() (cron metodu)</text>
    <text x="34" y="303" font-size="10.5" fill="#334155">out_invoice + payment_state (not_paid/partial)</text>
    <text x="34" y="320" font-size="10.5" fill="#334155">invoice_date_due &lt; bugün</text>
    <text x="34" y="337" font-size="10.5" fill="#334155">ilk 20 fatura + toplam sayı · yoksa sessiz</text>
  </g>

  <!-- ir.cron chip -->
  <g font-family="Helvetica">
    <rect x="330" y="266" width="280" height="70" rx="9" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="344" y="288" font-size="11.5" font-weight="700" fill="#9d174d">ir.cron — Telegram: Overdue Invoices Report</text>
    <text x="344" y="308" font-size="10.5" fill="#334155">günlük · interval (1 gün) · Run Manually ile test</text>
    <text x="344" y="325" font-size="10.5" fill="#64748b">code: model._telegram_overdue_report()</text>
    <path d="M274 300 H326" stroke="#64748b" stroke-width="1.4" marker-end="url(#b)"/>
    <text x="303" y="290" text-anchor="middle" font-size="10" fill="#64748b">günlük</text>
  </g>

  <!-- telegram api -->
  <g font-family="Helvetica">
    <rect x="666" y="240" width="250" height="120" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="666" y="240" width="250" height="26" rx="9" fill="#dbeafe"/>
    <text x="676" y="258" font-size="12" font-weight="700" fill="#1e40af">Telegram Bot API</text>
    <text x="676" y="286" font-size="10.5" fill="#334155">POST api.telegram.org/bot&lt;token&gt;/sendMessage</text>
    <text x="676" y="303" font-size="10.5" fill="#334155">timeout 10 s · JSON payload</text>
    <text x="676" y="320" font-size="10.5" fill="#334155">disable_web_page_preview</text>
    <text x="676" y="345" font-size="10.5" fill="#1e40af">hata durumunda HTTP çağrısı sessiz kalır</text>
    <path d="M614 145 H662" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
  </g>

  <!-- legend -->
  <g font-family="Helvetica" font-size="10.5">
    <line x1="24" y1="390" x2="56" y2="390" stroke="#b45309" stroke-width="1.6"/><text x="62" y="394" fill="#475569">tetikleyici → merkez dağıtıcı</text>
    <line x1="260" y1="390" x2="292" y2="390" stroke="#64748b" stroke-width="1.4"/><text x="298" y="394" fill="#475569">çizelge (cron)</text>
    <line x1="400" y1="390" x2="432" y2="390" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="438" y="394" fill="#475569">dış HTTP çağrı</text>
    <text x="24" y="416" fill="#94a3b8">tek merkez (_send) · birden fazla tetikleyici · satış güvence altında · cron fatura raporu</text>
  </g>
</svg>
