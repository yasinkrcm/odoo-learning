<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="buksu_stok_saha mimari">
  <defs>
    <linearGradient id="hh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a16207"/><stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="940" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#hh)"/>
  <text x="24" y="29" font-family="Helvetica" font-size="17" font-weight="700" fill="#ffffff">buksu_stok_saha — Saha Depo Malzeme Akışı</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica" font-size="11.5" fill="#fef9c3">depends: stock, project</text>

  <!-- wizard -->
  <g font-family="Helvetica">
    <rect x="330" y="70" width="280" height="170" rx="9" fill="#ffffff" stroke="#fde047"/>
    <rect x="330" y="70" width="280" height="26" rx="9" fill="#fef9c3"/>
    <text x="340" y="88" font-size="12" font-weight="700" fill="#713f12">buksu.saha.talep.wizard (Transient)</text>
    <text x="340" y="116" font-size="10.5" fill="#334155">proje_id (zorunlu) · talep_tarihi · aciklama</text>
    <text x="340" y="133" font-size="10.5" fill="#334155">hedef_saha_depo_id — domain: is_saha_depo</text>
    <text x="340" y="150" font-size="10.5" fill="#334155">kaynak_depo_id — merkez depo (varsayılan)</text>
    <text x="340" y="167" font-size="10.5" fill="#334155">satır: urun_id · miktar &gt; 0 · mevcut_stok (quant)</text>
    <text x="340" y="190" font-size="10.5" fill="#525252">_onchange_proje_id → projenin kayıtlı saha deposu</text>
    <text x="340" y="214" font-size="10.5" fill="#713f12">action_onayla() → TEK outgoing picking + tüm move'lar</text>
    <text x="340" y="231" font-size="10.5" fill="#713f12">(0,0,...) komutları + action_confirm() yönlendirme</text>
  </g>

  <!-- stock.location -->
  <g font-family="Helvetica">
    <rect x="24" y="70" width="250" height="130" rx="9" fill="#ffffff" stroke="#fde047"/>
    <rect x="24" y="70" width="250" height="26" rx="9" fill="#fef9c3"/>
    <text x="34" y="88" font-size="12" font-weight="700" fill="#713f12">stock.location (extend)</text>
    <text x="34" y="116" font-size="10.5" fill="#334155">is_saha_depo (Boolean — geçici şantiye deposu)</text>
    <text x="34" y="133" font-size="10.5" fill="#334155">proje_id (M2o project.project)</text>
    <text x="34" y="150" font-size="10.5" fill="#334155">_compute_display_name → '[Saha] …' öneki</text>
    <text x="34" y="172" font-size="10.5" fill="#a16207">Odoo 19: name_get yerine _compute_display_name</text>
    <path d="M274 140 H326" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="300" y="130" text-anchor="middle" font-size="10" fill="#7c3aed">hedef domain</text>
  </g>

  <!-- project.project -->
  <g font-family="Helvetica">
    <rect x="666" y="70" width="250" height="140" rx="9" fill="#ffffff" stroke="#fde047"/>
    <rect x="666" y="70" width="250" height="26" rx="9" fill="#fef9c3"/>
    <text x="676" y="88" font-size="12" font-weight="700" fill="#713f12">project.project (extend)</text>
    <text x="676" y="116" font-size="10.5" fill="#334155">saha_kullanici_ids (özel M2M — user_ids kaldırıldı)</text>
    <text x="676" y="133" font-size="10.5" fill="#334155">malzeme_hareket_sayisi (search_count)</text>
    <text x="676" y="150" font-size="10.5" fill="#334155">action_view_malzeme_hareketleri() — akıllı buton</text>
    <text x="676" y="172" font-size="10.5" fill="#a16207">Kayıt kurallarının ayrıştırıcı anahtarı</text>
    <path d="M662 180 C600 200 570 190 614 212" stroke="#7c3aed" stroke-width="1.4" fill="none"/>
  </g>

  <!-- stock.picking -->
  <g font-family="Helvetica">
    <rect x="300" y="290" width="250" height="110" rx="9" fill="#ffffff" stroke="#fde047"/>
    <rect x="300" y="290" width="250" height="26" rx="9" fill="#fef9c3"/>
    <text x="310" y="308" font-size="12" font-weight="700" fill="#713f12">stock.picking (extend)</text>
    <text x="310" y="336" font-size="10.5" fill="#334155">proje_id (M2o, indexed)</text>
    <text x="310" y="353" font-size="10.5" fill="#334155">sorumlu_ekip (Char)</text>
    <text x="310" y="370" font-size="10.5" fill="#334155">origin: 'Saha Talebi — &lt;proje&gt;'</text>
    <path d="M470 244 V286" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="560" y="270" text-anchor="middle" font-size="10" fill="#7c3aed">wizard üretir</text>
  </g>

  <!-- stock.move -->
  <g font-family="Helvetica">
    <rect x="610" y="290" width="306" height="110" rx="9" fill="#ffffff" stroke="#fde047"/>
    <rect x="610" y="290" width="306" height="26" rx="9" fill="#fef9c3"/>
    <text x="620" y="308" font-size="12" font-weight="700" fill="#713f12">stock.move (extend)</text>
    <text x="620" y="336" font-size="10.5" fill="#334155">proje_id / sorumlu_ekip — picking_id üzerinden related</text>
    <text x="620" y="353" font-size="10.5" fill="#334155">store=True → indexed read_group raporlaması</text>
    <text x="620" y="370" font-size="10.5" fill="#334155">list kolonları + proje bazlı gruplama filtreleri</text>
    <path d="M550 345 H606" stroke="#64748b" stroke-width="1.4" marker-end="url(#b)"/>
    <text x="578" y="337" text-anchor="middle" font-size="10" fill="#64748b">move_id</text>
  </g>

  <!-- security -->
  <g font-family="Helvetica">
    <rect x="24" y="290" width="230" height="110" rx="9" fill="#fff1f2" stroke="#fda4af"/>
    <rect x="24" y="290" width="230" height="26" rx="9" fill="#ffe4e6"/>
    <text x="34" y="308" font-size="12" font-weight="700" fill="#881337">İzin Ayrımı (ir.rule)</text>
    <text x="34" y="336" font-size="10.5" fill="#334155">Saha Ekibi: sadece kendi projesi</text>
    <text x="34" y="353" font-size="10.5" fill="#334155">(saha_kullanici_ids içinde uid)</text>
    <text x="34" y="370" font-size="10.5" fill="#334155">Depo Sorumlusu: [(1, '=', 1)] tam yetki</text>
    <path d="M254 345 H296" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#b)"/>
  </g>

  <!-- legend -->
  <g font-family="Helvetica" font-size="10.5">
    <line x1="24" y1="440" x2="56" y2="440" stroke="#7c3aed" stroke-width="1.6"/><text x="62" y="444" fill="#475569">alan / domain</text>
    <line x1="180" y1="440" x2="212" y2="440" stroke="#64748b" stroke-width="1.6"/><text x="218" y="444" fill="#475569">veri ilişkisi</text>
    <text x="24" y="462" fill="#94a3b8">merkez depo → saha deposu transferi · her hareket projeye bağlı · wizard üretir, talep sihirbazı tek picking üretir</text>
  </g>
</svg>
