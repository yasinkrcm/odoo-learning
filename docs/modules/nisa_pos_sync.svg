      <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="940" height="220" rx="12" fill="#ffffff" stroke="#67e8f9"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#h)"/>
  <text x="24" y="29" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">nisa_pos_sync — Dış POS &amp; Envanter Senkronu</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#cffafe">depends: product</text>

  <text x="24" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0e7490">MODELLER</text>
