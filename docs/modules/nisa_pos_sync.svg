    <text x="122" y="141" text-anchor="middle" font-weight="600">nisa.sync.log</text>
    <rect x="24" y="158" width="196" height="30" rx="15" fill="#cffafe" stroke="#67e8f9"/>
    <text x="122" y="177" text-anchor="middle" font-weight="600">product.product (inherit)</text>
