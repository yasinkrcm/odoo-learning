<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="buksu_hakedis mimari">
  <defs>
    <linearGradient id="hh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="940" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#hh)"/>
  <text x="24" y="29" font-family="Helvetica" font-size="17" font-weight="700" fill="#ffffff">buksu_hakedis — Model İlişkileri &amp; Akış</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica" font-size="11.5" fill="#dcfce7">depends: base, project, web, account</text>

  <!-- Status chain -->
  <g font-family="Helvetica" font-size="12" font-weight="600">
    <rect x="24" y="58" width="92" height="26" rx="13" fill="#e2e8f0"/><text x="70" y="75" text-anchor="middle" fill="#475569">taslak</text>
    <path d="M120 71 H150" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
    <rect x="154" y="58" width="112" height="26" rx="13" fill="#dcfce7" stroke="#22c55e"/><text x="210" y="75" text-anchor="middle" fill="#166534">onaylandi</text>
    <path d="M270 71 H300" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
    <rect x="304" y="58" width="92" height="26" rx="13" fill="#fef9c3" stroke="#eab308"/><text x="350" y="75" text-anchor="middle" fill="#854d0e">odendi</text>
  </g>
  <text x="420" y="75" font-family="Helvetica" font-size="11" fill="#b91c1c">ileri yönlü kilitleli — write() geri dönüşü UserError ile engeller</text>

  <!-- project.project -->
  <g font-family="Helvetica">
    <rect x="24" y="104" width="196" height="130" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="24" y="104" width="196" height="26" rx="9" fill="#dcfce7"/>
    <text x="34" y="122" font-size="12" font-weight="700" fill="#14532d">project.project (extend)</text>
    <text x="34" y="150" font-size="10.5" fill="#334155">hakedis_donem_ids (O2M)</text>
    <text x="34" y="167" font-size="10.5" fill="#334155">hakedis_donem_sayisi (compute)</text>
    <text x="34" y="184" font-size="10.5" fill="#334155">action_view_hakedis_donem()</text>
    <text x="34" y="201" font-size="10.5" fill="#64748b">akıllı buton + proje formunda tab</text>
    <path d="M220 170 H318" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="269" y="162" text-anchor="middle" font-size="10" fill="#7c3aed">M2o proje_id</text>
  </g>

  <!-- donem -->
  <g font-family="Helvetica">
    <rect x="322" y="104" width="252" height="160" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="322" y="104" width="252" height="26" rx="9" fill="#dcfce7"/>
    <text x="332" y="122" font-size="12" font-weight="700" fill="#14532d">buksu.hakedis.donem</text>
    <text x="332" y="150" font-size="10.5" fill="#334155">name · ir.sequence (HAK/YYYY/####)</text>
    <text x="332" y="167" font-size="10.5" fill="#334155">ekip_id (M2o, dolunur zorunlu)</text>
    <text x="332" y="184" font-size="10.5" fill="#334155">tarih_baslangic / tarih_bitis (constrains)</text>
    <text x="332" y="201" font-size="10.5" fill="#334155">brut_toplam / kesinti_tutari / net_tutar</text>
    <text x="332" y="218" font-size="10.5" fill="#334155">fatura_id (account.move, in_invoice)</text>
    <text x="332" y="235" font-size="10.5" fill="#334155">fatura_durumu = fatura_id.payment_state</text>
  </g>

  <!-- ekip -->
  <g font-family="Helvetica">
    <rect x="700" y="104" width="216" height="118" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="700" y="104" width="216" height="26" rx="9" fill="#dcfce7"/>
    <text x="710" y="122" font-size="12" font-weight="700" fill="#14532d">buksu.ekip</text>
    <text x="710" y="150" font-size="10.5" fill="#334155">name (UNIQUE) · active</text>
    <text x="710" y="167" font-size="10.5" fill="#334155">partner_id (M2o, zorunlu satıcı)</text>
    <text x="710" y="184" font-size="10.5" fill="#334155">sorumlu_id (M2o res.users)</text>
  </g>

  <!-- satir -->
  <g font-family="Helvetica">
    <rect x="322" y="296" width="252" height="118" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="322" y="296" width="252" height="26" rx="9" fill="#dcfce7"/>
    <text x="332" y="314" font-size="12" font-weight="700" fill="#14532d">buksu.hakedis.satir</text>
    <text x="332" y="342" font-size="10.5" fill="#334155">donem_id (M2o, cascade, indexed)</text>
    <text x="332" y="359" font-size="10.5" fill="#334155">is_kalemi · birim (m²/m³/adet/kg)</text>
    <text x="332" y="376" font-size="10.5" fill="#334155">miktar × birim_fiyat → toplam (compute)</text>
    <text x="332" y="393" font-size="10.5" fill="#334155">kesinti_yuzdesi (%0–100)</text>
    <text x="332" y="410" font-size="10.5" fill="#b91c1c">durum != taslak → create/write/unlink engelli</text>
    <path d="M448 264 V292" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="512" y="283" font-size="10" fill="#7c3aed">O2M satir_ids / M2o donem_id</text>
  </g>

  <!-- account.move -->
  <g font-family="Helvetica">
    <rect x="700" y="296" width="216" height="118" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="700" y="296" width="216" height="26" rx="9" fill="#dcfce7"/>
    <text x="710" y="314" font-size="12" font-weight="700" fill="#14532d">account.move (satıcı faturası)</text>
    <text x="710" y="342" font-size="10.5" fill="#334155">in_invoice · ekip partner üzerinden</text>
    <text x="710" y="359" font-size="10.5" fill="#334155">line_ids ← hakediş satırları</text>
    <text x="710" y="376" font-size="10.5" fill="#334155">payment_state takibi</text>
    <path d="M578 230 H696 V310" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
    <text x="618" y="252" font-size="10" fill="#ea580c">action_fatura_olustur() (sudo)</text>
    <path d="M700 380 H640 V240 H578" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 4" fill="none" marker-end="url(#b)"/>
    <text x="598" y="392" font-size="10" fill="#64748b">payment_state → fatura_durumu</text>
  </g>

  <!-- QWeb report chip -->
  <g font-family="Helvetica">
    <rect x="24" y="296" width="196" height="118" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="34" y="318" font-size="11.5" font-weight="700" fill="#1e40af">QWeb PDF Rapor</text>
    <text x="34" y="340" font-size="10.5" fill="#334155">proje + dönem kırılımı</text>
    <text x="34" y="357" font-size="10.5" fill="#334155">kalem bazlı hesap dökümü</text>
    <text x="34" y="374" font-size="10.5" fill="#334155">imza blokları</text>
    <path d="M322 380 H224" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 4" fill="none" marker-end="url(#b)"/>
  </g>

  <!-- legend -->
  <g font-family="Helvetica" font-size="10.5">
    <line x1="24" y1="440" x2="56" y2="440" stroke="#7c3aed" stroke-width="1.6"/><text x="62" y="444" fill="#475569">ORM alanı (M2o / O2M / compute)</text>
    <line x1="242" y1="440" x2="274" y2="440" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 4"/><text x="280" y="444" fill="#475569">veri dönüşü / rapor akışı</text>
    <line x1="446" y1="440" x2="478" y2="440" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="484" y="444" fill="#475569">metot çağrısı (fatura üretimi)</text>
    <text x="24" y="462" fill="#94a3b8">satırlar onay öncesi serbest · dönem numarası HAK/YYYY · hakediş → satıcı faturası → ödeme durumu takibi</text>
  </g>
</svg>
