<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="mini_helpdesk mimari">
  <defs>
    <linearGradient id="hh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be123c"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="940" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#hh)"/>
  <text x="24" y="29" font-family="Helvetica" font-size="17" font-weight="700" fill="#ffffff">mini_helpdesk — Ticket Akışı &amp; SLA Motoru</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica" font-size="11.5" fill="#ffe4e6">depends: mail, telegram_notify</text>

  <!-- stage -->
  <g font-family="Helvetica">
    <rect x="24" y="70" width="250" height="150" rx="9" fill="#ffffff" stroke="#fda4af"/>
    <rect x="24" y="70" width="250" height="26" rx="9" fill="#ffe4e6"/>
    <text x="34" y="88" font-size="12" font-weight="700" fill="#881337">mini.helpdesk.stage</text>
    <text x="34" y="116" font-size="10.5" fill="#334155">sequence · fold · is_closed</text>
    <text x="34" y="133" font-size="10.5" fill="#334155">New → In Progress → Waiting → Solved</text>
    <text x="34" y="150" font-size="10.5" fill="#334155">_read_group_stage_ids (boş aşama görünür)</text>
    <text x="34" y="172" font-size="10.5" fill="#9f1239">is_closed=true → SLA kontrolü maskeleme</text>
    <path d="M274 145 H326" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="300" y="137" text-anchor="middle" font-size="10" fill="#7c3aed">stage_id</text>
  </g>

  <!-- ticket -->
  <g font-family="Helvetica">
    <rect x="330" y="70" width="290" height="200" rx="9" fill="#ffffff" stroke="#fda4af"/>
    <rect x="330" y="70" width="290" height="26" rx="9" fill="#ffe4e6"/>
    <text x="340" y="88" font-size="12" font-weight="700" fill="#881337">mini.helpdesk.ticket</text>
    <text x="340" y="116" font-size="10.5" fill="#334155">number — ir.sequence 'TCK/0001' (model_create_multi)</text>
    <text x="340" y="133" font-size="10.5" fill="#334155">name · description · partner_id · user_id (tracking)</text>
    <text x="340" y="150" font-size="10.5" fill="#334155">priority 0–3 → SLA: 72 / 48 / 24 / 4 saat</text>
    <text x="340" y="167" font-size="10.5" fill="#334155">sla_deadline (compute create_date + saat, store)</text>
    <text x="340" y="184" font-size="10.5" fill="#334155">is_sla_breached (compute) → ribbon + decoration-danger</text>
    <text x="340" y="201" font-size="10.5" fill="#334155">sla_notified (copy=False — çift bildirim engeli)</text>
    <text x="340" y="224" font-size="10.5" fill="#334155">mail.thread + mail.activity.mixin → chatter</text>
    <text x="340" y="244" font-size="10.5" fill="#9f1239">create/write → eski değer yakalanarak Telegram alan değişim bildirimleri</text>
  </g>

  <!-- telegram -->
  <g font-family="Helvetica">
    <rect x="666" y="70" width="250" height="110" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="666" y="70" width="250" height="26" rx="9" fill="#dbeafe"/>
    <text x="676" y="88" font-size="12" font-weight="700" fill="#1e40af">telegram.notifier</text>
    <text x="676" y="116" font-size="10.5" fill="#334155">parse_mode='HTML' · html.escape</text>
    <text x="676" y="133" font-size="10.5" fill="#334155">oluştur / aşama / atama / öncelik olayları</text>
    <text x="676" y="155" font-size="10.5" fill="#1e40af">'Solved' aşaması özel mesaj yollar</text>
    <path d="M620 130 H662" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#c)"/>
  </g>

  <!-- cron -->
  <g font-family="Helvetica">
    <rect x="24" y="260" width="250" height="130" rx="9" fill="#ffffff" stroke="#fda4af"/>
    <rect x="24" y="260" width="250" height="26" rx="9" fill="#ffe4e6"/>
    <text x="34" y="278" font-size="12" font-weight="700" fill="#881337">ir.cron — 15 dakika</text>
    <text x="34" y="306" font-size="10.5" fill="#334155">_cron_sla_check()</text>
    <text x="34" y="323" font-size="10.5" fill="#334155">aşım: deadline &lt; now + açık aşama</text>
    <text x="34" y="340" font-size="10.5" fill="#334155">chatter notu + assignee aktivitesi</text>
    <text x="34" y="357" font-size="10.5" fill="#334155">TG 🚨 uyarısı → sla_notified=True</text>
    <text x="34" y="379" font-size="10.5" fill="#9f1239">her bir hedef için TEK SEFER uyarır</text>
    <path d="M274 325 H326" stroke="#64748b" stroke-width="1.4" marker-end="url(#b)"/>
    <text x="300" y="315" text-anchor="middle" font-size="10" fill="#64748b">kontrol</text>
  </g>

  <!-- views -->
  <g font-family="Helvetica">
    <rect x="330" y="310" width="290" height="80" rx="9" fill="#ffffff" stroke="#fda4af"/>
    <rect x="330" y="310" width="290" height="26" rx="9" fill="#ffe4e6"/>
    <text x="340" y="328" font-size="12" font-weight="700" fill="#881337">views (Kanban / List / Form / Arama)</text>
    <text x="340" y="352" font-size="10.5" fill="#334155">Kanban &lt;t t-name="card"&gt; + stage gruplama</text>
    <text x="340" y="369" font-size="10.5" fill="#334155">form: &lt;chatter/&gt; + SLA ribbon</text>
    <text x="340" y="386" font-size="10.5" fill="#334155">arama: My Tickets / Open / SLA Breached</text>
  </g>

  <!-- ACL chip -->
  <g font-family="Helvetica">
    <rect x="666" y="260" width="250" height="130" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="666" y="260" width="250" height="26" rx="9" fill="#dcfce7"/>
    <text x="676" y="278" font-size="12" font-weight="700" fill="#166534">Güvenlik</text>
    <text x="676" y="306" font-size="10.5" fill="#334155">ticket: kullanıcı RW+C · Unlink yok</text>
    <text x="676" y="323" font-size="10.5" fill="#334155">stage: sadece okuma izni</text>
    <text x="676" y="345" font-size="10.5" fill="#166534">not: SLA saatleri öncelikten türetilir</text>
    <text x="676" y="366" font-size="10.5" fill="#64748b">mini.helpdesk.* ACL'leri</text>
  </g>

  <!-- legend -->
  <g font-family="Helvetica" font-size="10.5">
    <line x1="24" y1="440" x2="56" y2="440" stroke="#7c3aed" stroke-width="1.6"/><text x="62" y="444" fill="#475569">M2o ilişki</text>
    <line x1="150" y1="440" x2="182" y2="440" stroke="#64748b" stroke-width="1.4"/><text x="188" y="444" fill="#475569">çizelge kontrolü</text>
    <line x1="310" y1="440" x2="342" y2="440" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="348" y="444" fill="#475569">Telegram bildirimi</text>
    <text x="24" y="462" fill="#94a3b8">ticket mantığı chatter üzerinden · SLA tek seferlik uyarı · aşama kapanınca tetikler kapanır</text>
  </g>
</svg>
