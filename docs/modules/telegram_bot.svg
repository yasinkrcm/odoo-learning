<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" role="img" aria-label="telegram_bot">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2045"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="940" height="220" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <rect x="1" y="1" width="938" height="44" rx="11" fill="url(#h)"/>
  <text x="24" y="29" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">telegram_bot — Çift Yönlü Telegram Botu</text>
  <text x="916" y="28" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#e0e7ff">depends: base, mail, telegram_notify, sale</text>

  <text x="24" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#3730a3">KATMANLAR</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3730a3">
    <rect x="24" y="86" width="196" height="30" rx="15" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="122" y="105" text-anchor="middle" font-weight="600">controllers/webhook.py</text>
    <rect x="24" y="122" width="196" height="30" rx="15" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="122" y="141" text-anchor="middle" font-weight="600">telegram.bot (dispatch + cron)</text>
    <rect x="24" y="158" width="196" height="30" rx="15" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="122" y="177" text-anchor="middle" font-weight="600">telegram.bot.log + views</text>
  </g>

  <text x="470" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#3730a3">ÖNE ÇIKANLAR</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">
    <circle cx="476" cy="95" r="3" fill="#4f46e5"/><text x="488" y="99">Webhook (secret header, 403/200) + 1 dk polling cron</text>
    <circle cx="476" cy="119" r="3" fill="#4f46e5"/><text x="488" y="123">/siparis · /stok · /musteri · /rapor · /bilet · /yardim</text>
    <circle cx="476" cy="143" r="3" fill="#4f46e5"/><text x="488" y="147">Telegram user id beyaz listesi (ICP parametresi)</text>
    <circle cx="476" cy="167" r="3" fill="#4f46e5"/><text x="488" y="171">Telegram HTML + html_escape — XSS-sız cevap üretimi</text>
    <circle cx="476" cy="191" r="3" fill="#4f46e5"/><text x="488" y="195">Her mesaj telegram.bot.log'da denetlenir</text>
  </g>
</svg>
